version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: edi-835-test-db
    environment:
      POSTGRES_DB: bot_automation
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot_test_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"  # Map to 5433 to avoid conflicts with local PostgreSQL
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot_automation"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - edi-test-network

volumes:
  postgres_test_data:
    driver: local

networks:
  edi-test-network:
    driver: bridge
